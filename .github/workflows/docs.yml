name: "VLT: Documentation"

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: docs

jobs:

  build:
    name: "Docs: Build"
    uses: plone/meta/.github/workflows/docs-build.yml@2.x
    with:
      python-version: ${{ inputs.python-version }}
      working-directory: ${{ inputs.working-directory }}
      # Vale is not a dependency of the docs project yet, so `make vale`
      # cannot run in CI.
      check-vale: false
