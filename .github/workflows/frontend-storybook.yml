name: Storybook Build
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.x"

defaults:
  run:
    working-directory: ./frontend

jobs:
  storybook-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_frontend@2.x
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: frontend

      - name: Build Storybook
        run: make storybook-build

      - name: Rename directory - it seems that upload-artifact does not work with hidden directories
        run: cp -r .storybook-build storybook-build

      # Upload Storybook build
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: storybook-build
          path: frontend/storybook-build
          retention-days: 2
